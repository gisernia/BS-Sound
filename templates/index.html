<!DOCTYPE html>
<html lang="it" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SoundTouch BS</title>
<link rel="stylesheet" href="/static/style.css?v=20260925-1">
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>📻 SoundTouch BS</h1>
      <div class="status" id="status">Connessione...</div>
    </div>
    <div class="theme-control">
      <label for="themeSelect">Tema</label>
      <select id="themeSelect" aria-label="Tema" onchange="setTheme(this.value)">
        <option value="system">Sistema</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>
</header>

<main>

  <!-- ROW 1: Now Playing + Preset Bose -->
  <div class="grid-top">

    <section class="card widget-now">
      <div class="widget-label">In riproduzione</div>
      <img id="nowFavicon" src="" alt="" style="display:none; position:absolute; top:14px; right:14px; width:44px; height:44px; object-fit:contain; border-radius:8px; background:var(--image-bg);">
      <div class="now-title" id="nowTitle">—</div>
      <div class="now-details" id="nowDetails"></div>
      <div class="now-icy" id="nowIcy"></div>
      <div class="controls">
        <button onclick="sendKey('PLAY_PAUSE')">⏯</button>
        <button onclick="sendKey('PREV_TRACK')">⏮</button>
        <button onclick="sendKey('NEXT_TRACK')">⏭</button>
        <button onclick="sendKey('MUTE')">🔇</button>
        <input class="volume" id="volume" type="range" min="0" max="100" value="0" oninput="changeVolume(this.value)">
        <span id="volumeText" class="vol-text">--</span>
      </div>
    </section>

    <section class="card widget-presets">
      <div class="widget-label">Preset Bose</div>
      <div class="preset-row" id="presets"></div>
    </section>

  </div>

  <!-- ROW 2: Search + Favorites -->
  <div class="grid-bottom">

    <div class="col-left">
      <section class="card">
        <div class="search-row">
          <input id="query" class="searchbox" placeholder="Cerca radio..." onkeydown="if(event.key==='Enter') searchRadio()">
          <button class="primary" onclick="searchRadio()">Cerca</button>
        </div>
        <div class="search-row" style="margin-top:8px">
          <input id="country" placeholder="Paese (es. IT)">
        </div>
      </section>
      <section id="debugPanel" class="card debug-panel" hidden>
        <div class="widget-label">Debug metadata</div>
        <pre id="debugMeta" class="debug-meta">{}</pre>
      </section>
      <section class="card">
        <div id="results"><div style="color:var(--muted); font-size:13px;">Cerca una radio per iniziare.</div></div>
        <div class="error" id="error"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="card widget-favorites">
        <div class="widget-label">⭐ Preferiti</div>
        <div id="favorites" style="margin-top:10px">
          <div id="fav-debug" style="color:var(--muted); font-size:13px;">Caricamento...</div>
        </div>
      </section>
    </div>

  </div>

</main>

<!-- REMOVE FAVORITE MODAL -->
<div id="removeFavModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) this.style.display='none'">
  <div class="modal-card" style="max-width:340px; text-align:center;">
    <div class="star-cancel-big">★</div>
    <h3 style="margin:0 0 8px;">Rimuovere dai preferiti?</h3>
    <div style="color:var(--muted); margin-bottom:20px;" id="removeFavName"></div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button type="button" onclick="document.getElementById('removeFavModal').style.display='none'">Annulla</button>
      <button type="button" id="removeFavConfirm" class="btn-danger">Rimuovi</button>
    </div>
  </div>
</div>

<!-- PRESET SELECTION MODAL -->
<div id="presetModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closePresetModal()">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; font-size:18px;">Salva nei Preset Bose (1–6)</h3>
      <button onclick="closePresetModal()" style="background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div style="font-size:14px; color:var(--muted); margin-bottom:15px;">
      Stazione: <b id="modalStationName" style="color:var(--text)"></b>
    </div>
    <div id="presetModalGrid" class="preset-grid"></div>
    <div style="margin-top:20px; text-align:right;">
      <button onclick="closePresetModal()">Annulla</button>
    </div>
  </div>
</div>

<script>
  window.APP_DEBUG = __APP_DEBUG__;
</script>
<script src="/static/app.js?v=20260925-1"></script>
</body>
</html>
