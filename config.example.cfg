# ============================================
# Beasof SoundTouch Radio - example config
# ============================================
# Copia questo file in config.cfg e personalizza i valori locali.
# Questo file va versionato in git: non inserire mai secret reali qui.

# IP della Bose SoundTouch
BOSE_IP=192.168.1.52

# Server web locale
SERVER_HOST=0.0.0.0
SERVER_PORT=8765

# Server Radio Browser
RADIO_BROWSER_HOST=https://de1.api.radio-browser.info

# Spotify app settings
# 1) crea un'app in https://developer.spotify.com/dashboard/
# 2) imposta Redirect URI: http://localhost:8765/api/spotify/callback
# 3) riempi i valori qui sotto con i tuoi dati reali
SPOTIFY_CLIENT_ID=
SPOTIFY_CLIENT_SECRET=
SPOTIFY_REDIRECT_URI=http://localhost:8765/api/spotify/callback
SPOTIFY_SCOPE=user-read-playback-state user-read-currently-playing user-modify-playback-state
SPOTIFY_ACCESS_TOKEN=
SPOTIFY_REFRESH_TOKEN=
SPOTIFY_ACCOUNT_NAME=
SPOTIFY_PREMIUM_ENABLED=N

# Debug metadata ICY visibile in pagina (true/false)
debug_icy=false

